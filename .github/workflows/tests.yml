name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel-ai: ['^0.9', '^0.10', '^0.11', '1.x-dev']

    name: PHP ${{ matrix.php }} / laravel-ai ${{ matrix.laravel-ai }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ matrix.laravel-ai }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel-ai }}-

      - name: Install dependencies
        run: |
          composer require "laravel/ai:${{ matrix.laravel-ai }}" --no-update --no-interaction
          composer update --no-progress --prefer-dist --no-interaction

      - name: Run test suite
        run: vendor/bin/pest --colors=always
